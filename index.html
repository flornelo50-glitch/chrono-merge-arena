<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070c" />
  <title>CHRONO-MERGE ARENA PRO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at top, #171d38 0%, #05070c 85%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      padding: 10px;
    }
    header, footer {
      width: 100%;
      max-width: 440px;
      padding: 10px 14px;
      background: #0d121f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #222c4a;
    }
    header { border-bottom: none; border-radius: 16px 16px 0 0; }
    footer { border-top: none; border-radius: 0 0 16px 16px; gap: 8px; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .title-row { display: flex; align-items: center; gap: 6px; }
    .title {
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 1rem;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #9b5de5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub-info { font-size: 0.7rem; color: #64748b; font-weight: 700; }
    .combo {
      background: linear-gradient(135deg, #fee440, #f15bb5);
      color: #05070c;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .combo.hidden { display: none; }
    .stats { display: flex; gap: 12px; font-size: 0.65rem; font-weight: 700; color: #94a3b8; }
    .stat-box { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-box span { font-size: 1rem; color: #fff; font-weight: 900; }
    #timer-box.urgent span { color: #ff1e56; animation: blink 0.5s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      background: #080c15;
      border-left: 1px solid #222c4a;
      border-right: 1px solid #222c4a;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    canvas { display: block; width: 100%; height: 100%; }
    button { border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
    button:active:not(:disabled) { transform: scale(0.94); }
    #power-btn { flex: 1; padding: 11px; font-size: 0.82rem; background: #161e33; color: #64748b; }
    #power-btn.ready { background: linear-gradient(135deg, #00bbf9, #9b5de5); color: #fff; box-shadow: 0 0 18px rgba(155, 93, 229, 0.55); }
    .icon-btn { padding: 11px 13px; font-size: 0.95rem; background: #161e33; color: #cbd5e1; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 12, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    .badge {
      background: rgba(0, 245, 212, 0.12);
      color: #00f5d4;
      border: 1px solid rgba(0, 245, 212, 0.4);
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    #overlay h2 {
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00f5d4, #fee440);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #overlay p { margin-bottom: 14px; line-height: 1.45; color: #cbd5e1; font-size: 0.84rem; }
    .modes { display: flex; gap: 6px; width: 100%; margin-bottom: 14px; }
    .mode-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.74rem;
      background: #141b2e;
      color: #94a3b8;
      border: 1px solid #232d4b;
    }
    .mode-btn.active {
      background: rgba(0, 187, 249, 0.18);
      color: #00f5d4;
      border-color: #00f5d4;
    }
    #start-btn {
      width: 100%;
      background: linear-gradient(135deg, #00f5d4, #00bbf9);
      color: #040810;
      padding: 13px;
      font-size: 0.98rem;
      letter-spacing: 0.5px;
      box-shadow: 0 0 22px rgba(0, 245, 212, 0.4);
    }
    .trophies { margin-top: 12px; font-size: 0.72rem; color: #94a3b8; }
    #toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: linear-gradient(135deg, #fee440, #ff9e00);
      color: #05070c;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 50;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast">🏆 CONQUISTA DESBLOQUEADA!</div>

  <header>
    <div class="brand">
      <div class="title-row">
        <span class="title">CHRONO-MERGE</span>
        <span id="combo-badge" class="combo hidden">x2</span>
      </div>
      <span id="mode-label" class="sub-info">MODO: CLÁSSICO</span>
    </div>
    <div class="stats">
      <div id="timer-box" class="stat-box hidden">TEMPO <span id="timer">60</span></div>
      <div class="stat-box">PONTOS <span id="score">0</span></div>
      <div class="stat-box">RECORDE <span id="best">0</span></div>
    </div>
  </header>

  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="badge">EDIÇÃO PRO 2.0</div>
      <h2 id="overlay-title">CHRONO-MERGE</h2>
      <p id="overlay-desc">
        <strong>O tempo só avança quando te moves.</strong><br>
        🔹 Junta iguais (2+2=4) • 🔴 Caça iguais ou menores.<br>
        ❄️ Carrega energia para congelar a arena!
      </p>
      <div class="modes">
        <button class="mode-btn active" data-mode="classic">⚔️ Clássico</button>
        <button class="mode-btn" data-mode="blitz">⏱️ 60 Seg</button>
        <button class="mode-btn" data-mode="survival">💀 Extremo</button>
      </div>
      <button id="start-btn">INICIAR PARTIDA</button>
      <div id="trophy-count" class="trophies">🏆 Conquistas: 0 / 4</div>
    </div>
  </div>

  <footer>
    <button id="power-btn" disabled>❄️ ENERGIA (0%)</button>
    <button id="sound-btn" class="icon-btn">🔊</button>
    <button id="restart-btn" class="icon-btn">↻</button>
  </footer>

  <script>
  (() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const timerBox = document.getElementById('timer-box');
    const timerEl = document.getElementById('timer');
    const modeLabel = document.getElementById('mode-label');
    const comboBadge = document.getElementById('combo-badge');
    const powerBtn = document.getElementById('power-btn');
    const soundBtn = document.getElementById('sound-btn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const trophyCount = document.getElementById('trophy-count');
    const toast = document.getElementById('toast');
    const modeBtns = document.querySelectorAll('.mode-btn');

    const N = 6;
    const DIRS = [{ r: -1, c: 0 }, { r: 1, c: 0 }, { r: 0, c: -1 }, { r: 0, c: 1 }];
    const COLORS = {
      2: ['#00bbf9', '#040810'], 4: ['#00f5d4', '#040810'], 8: ['#38b000', '#fff'],
      16: ['#9b5de5', '#fff'], 32: ['#f15bb5', '#fff'], 64: ['#ff9e00', '#040810'],
      128: ['#fee440', '#040810'], 256: ['#ffffff', '#040810']
    };

    let mode = 'classic';
    let cell = 0, grid = [], parts = [], texts = [], waves = [];
    let score = 0, combo = 1, energy = 0, freeze = 0, shake = 0, turns = 0;
    let timeLeft = 60, timerId = null, bgmId = null, beatStep = 0;
    let over = false, muted = false, actx = null;

    let bests = JSON.parse(localStorage.getItem('cm_pro_bests') || '{"classic":0,"blitz":0,"survival":0}');
    let achievements = JSON.parse(localStorage.getItem('cm_pro_ach') || '{}');

    function updateTrophies() {
      const unlocked = Object.keys(achievements).length;
      trophyCount.textContent = `🏆 Conquistas: ${unlocked} / 4`;
    }
    updateTrophies();
    bestEl.textContent = bests[mode] || 0;

    function unlock(id, label) {
      if (achievements[id]) return;
      achievements[id] = true;
      localStorage.setItem('cm_pro_ach', JSON.stringify(achievements));
      updateTrophies();
      toast.textContent = `🏆 ${label}`;
      toast.classList.add('show');
      tone(880, 'triangle', 0.25);
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function vib(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function tone(f, t, d, v = 0.07) {
      if (muted || !actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = t; o.frequency.value = f;
      g.gain.setValueAtTime(v, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
    }

    function startBgm() {
      if (bgmId) clearInterval(bgmId);
