<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHRONO-MERGE PRO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #05070c; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 8px; }
  header, footer { width: 100%; max-width: 400px; padding: 10px 14px; background: #0e1320; display: flex; justify-content: space-between; align-items: center; border: 1px solid #232d4b; }
  header { border-bottom: none; border-radius: 14px 14px 0 0; }
  footer { border-top: none; border-radius: 0 0 14px 14px; gap: 8px; flex-direction: column; }
  .title { font-weight: 900; font-size: 1rem; color: #00f5d4; }
  .sub { font-size: 0.7rem; color: #94a3b8; font-weight: 700; }
  .combo { background: #fee440; color: #000; font-size: 0.7rem; font-weight: 900; padding: 2px 6px; border-radius: 6px; margin-left: 6px; display: none; }
  .stats { display: flex; gap: 12px; font-size: 0.65rem; font-weight: 700; color: #94a3b8; }
  .stat-box { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-box span { font-size: 1rem; color: #fff; font-weight: 900; }
  #game-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; background: #090d16; border-left: 1px solid #232d4b; border-right: 1px solid #232d4b; }
  canvas { display: block; width: 100%; height: 100%; }
  button { border: none; border-radius: 10px; font-weight: 800; cursor: pointer; }
  .actions { display: flex; gap: 6px; width: 100%; }
  #power-btn { flex: 1; padding: 11px; font-size: 0.8rem; background: #182036; color: #64748b; }
  #power-btn.ready { background: #9b5de5; color: #fff; }
  .icon-btn { padding: 11px 14px; font-size: 0.95rem; background: #182036; color: #fff; }
  .dpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-top: 4px; }
  .dir-btn { background: #141b2e; color: #00f5d4; padding: 12px 0; font-size: 1.1rem; border: 1px solid #232d4b; }
  #overlay { position: absolute; inset: 0; background: rgba(5, 7, 12, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; z-index: 30; }
  #overlay h2 { font-size: 1.65rem; font-weight: 900; margin-bottom: 6px; color: #00f5d4; }
  #overlay p { margin-bottom: 12px; line-height: 1.4; color: #cbd5e1; font-size: 0.82rem; }
  .modes { display: flex; gap: 6px; width: 100%; margin-bottom: 12px; }
  .mode-btn { flex: 1; padding: 10px 4px; font-size: 0.75rem; background: #141b2e; color: #94a3b8; border: 1px solid #232d4b; }
  .mode-btn.active { background: #00bbf9; color: #040810; border-color: #00f5d4; }
  #start-btn { width: 100%; background: #00f5d4; color: #040810; padding: 14px; font-size: 1rem; }
  .trophies { margin-top: 8px; font-size: 0.72rem; color: #fee440; }
  #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #fee440; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.78rem; font-weight: 900; transition: transform 0.3s; z-index: 50; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="toast">🏆 CONQUISTA!</div>
<header>
  <div>
    <div><span class="title">CHRONO-MERGE</span><span id="combo-badge" class="combo">x2</span></div>
    <div id="mode-label" class="sub">MODO: CLÁSSICO</div>
  </div>
  <div class="stats">
    <div id="timer-box" class="stat-box" style="display:none">TEMPO <span id="timer">60</span></div>
    <div class="stat-box">PONTOS <span id="score">0</span></div>
    <div class="stat-box">RECORDE <span id="best">0</span></div>
  </div>
</header>
<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">CHRONO-MERGE</h2>
    <p id="overlay-desc"><strong>O tempo só avança quando te moves.</strong><br>🔹 Junta iguais (2+2=4) • 🔴 Caça iguais ou menores.</p>
    <div class="modes">
      <button type="button" class="mode-btn active" id="m-classic">⚔️ Clássico</button>
      <button type="button" class="mode-btn" id="m-blitz">⏱️ 60 Seg</button>
      <button type="button" class="mode-btn" id="m-survival">💀 Extremo</button>
    </div>
    <button type="button" id="start-btn">INICIAR PARTIDA</button>
    <div id="trophy-count" class="trophies">🏆 Conquistas: 0 / 4</div>
  </div>
</div>
<footer>
  <div class="actions">
    <button type="button" id="power-btn" disabled>❄️ ENERGIA (0%)</button>
    <button type="button" id="sound-btn" class="icon-btn">🔊</button>
    <button type="button" id="restart-btn" class="icon-btn">↻</button>
  </div>
  <div class="dpad">
    <button type="button" class="dir-btn" id="d-left">◀</button>
    <button type="button" class="dir-btn" id="d-up">▲</button>
    <button type="button" class="dir-btn" id="d-down">▼</button>
    <button type="button" class="dir-btn" id="d-right">▶</button>
  </div>
</footer>
<script>
(function() {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var N = 6;
  var DIRS = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
  var PALETTE = {
    2: {bg:'#00bbf9', fg:'#040810'},
    4: {bg:'#00f5d4', fg:'#040810'},
    8: {bg:'#38b000', fg:'#ffffff'},
    16: {bg:'#9b5de5', fg:'#ffffff'},
    32: {bg:'#f15bb5', fg:'#ffffff'},
    64: {bg:'#ff9e00', fg:'#040810'},
    128: {bg:'#fee440', fg:'#040810'},
    256: {bg:'#ffffff', fg:'#040810'}
  };
  var mode = 'classic', cell = 50, grid = [], parts = [], texts = [];
  var score = 0, combo = 1, energy = 0, freeze = 0, shake = 0, turns = 0;
  var timeLeft = 60, timerId = null, over = false, muted = false, actx = null;
  var bests = {classic:0, blitz:0, survival:0};
  var ach = {};
  try {
    var sb = localStorage.getItem('cm_bests'); if (sb) bests = JSON.parse(sb);
    var sa = localStorage.getItem('cm_ach'); if (sa) ach = JSON.parse(sa);
  } catch (e) {}

  function updateTrophies() {
    document.getElementById('trophy-count').textContent = '🏆 Conquistas: ' + Object.keys(ach).length + ' / 4';
  }
  updateTrophies();
  document.getElementById('best').textContent = bests[mode] || 0;

  function unlock(id, label) {
    if (ach[id]) return;
    ach[id] = true;
    try { localStorage.setItem('cm_ach', JSON.stringify(ach)); } catch (e) {}
    updateTrophies();
    var t = document.getElementById('toast');
    t.textContent = '🏆 ' + label;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function tone(f, type, dur) {
    if (muted || !actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.07, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function setMode(m, btnId) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(btnId).classList.add('active');
    document.getElementById('best').textContent = bests[mode] || 0;
    document.getElementById('mode-label').textContent = 'MODO: ' + (m === 'classic' ? 'CLÁSSICO' : m === 'blitz' ? '60 SEG' : 'EXTREMO');
  }

  document.getElementById('m-classic').onclick = function() { setMode('classic', 'm-classic'); };
  document.getElementById('m-blitz').onclick = function() { setMode('blitz', 'm-blitz'); };
  document.getElementById('m-survival').onclick = function() { setMode('survival', 'm-survival'); };
  document.getElementById('sound-btn').onclick = function() {
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  };

  function resize() {
    var w = canvas.parentElement.getBoundingClientRect().width || 320;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = w * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = w / N;
  }
  window.addEventListener('resize', resize);
  resize();

  function fx(c, r, col, txt) {
    for (var i = 0; i < 10; i++) {
      var a = Math.random() * 6.28, s = 1.5 + Math.random() * 3.5;
      parts.push({x:(c+0.5)*cell, y:(r+0.5)*cell, vx:Math.cos(a)*s, vy:Math.sin(a)*s, l:1, col:col});
    }
    if (txt) texts.push({x:(c+0.5)*cell, y:(r+0.4)*cell, txt:txt, col:col, l:1});
  }

  function ui() {
    document.getElementById('score').textContent = score;
    if (score > (bests[mode] || 0)) {
      bests[mode] = score;
      document.getElementById('best').textContent = score;
      try { localStorage.setItem('cm_bests', JSON.stringify(bests)); } catch (e) {}
    }
    if (score >= 1000) unlock('pts1000', '1.000 Pontos!');
    if (combo >= 5) unlock('combo5', 'Combo x5!');
    var cb = document.getElementById('combo-badge');
    cb.textContent = 'x' + combo;
    cb.style.display = combo > 1 ? 'inline-block' : 'none';
    var pb = document.getElementById('power-btn');
    if (freeze > 0) { pb.textContent = '❄️ CONGELADO (' + freeze + ')'; pb.className = ''; pb.disabled = true; }
    else if (energy >= 100) { pb.textContent = '❄️ CONGELAR INIMIGOS!'; pb.className = 'ready'; pb.disabled = false; }
    else { pb.textContent = '❄️ ENERGIA (' + energy + '%)'; pb.className = ''; pb.disabled = true; }
  }

  function emptyCells() {
    var r = [];
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if (!grid[i][j]) r.push({r:i, c:j});
    return r;
  }

  function spawn(team, val) {
    var e = emptyCells();
    if (!e.length) return;
    var s = e[Math.floor(Math.random() * e.length)];
    grid[s.r][s.c] = {team:team, val:val, sc:0.2};
  }

  function startGame() {
    try {
